<!doctype html>
<html lang="da">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>
        Daily Climb — Baneoversigt
    </title>

    <style>
        :root {
            color-scheme: dark;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                #08111f;

            color:
                #f8fafc;
        }


        * {
            box-sizing:
                border-box;
        }


        body {
            margin:
                0;

            min-height:
                100dvh;

            background:
                #08111f;
        }


        button,
        input {
            font:
                inherit;
        }


        .hidden {
            display:
                none !important;
        }


        .app {
            width:
                min(1180px,
                    100%);

            margin:
                auto;

            padding:
                18px;
        }


        .top {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                12px;

            margin-bottom:
                18px;
        }


        .brand {
            text-decoration:
                none;

            color:
                white;
        }


        .brand small {
            display:
                block;

            font-size:
                9px;

            letter-spacing:
                .18em;

            opacity:
                .5;

            font-weight:
                900;
        }


        .brand strong {
            font-size:
                26px;

            letter-spacing:
                -.04em;
        }


        .actions {
            display:
                flex;

            gap:
                8px;
        }


        .btn,
        .btn-primary {
            border-radius:
                11px;

            padding:
                10px 13px;

            text-decoration:
                none;

            font-weight:
                900;

            font-size:
                11px;
        }


        .btn {
            color:
                #fff;

            background:
                rgba(255,
                    255,
                    255,
                    .06);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .1);
        }


        .btn-primary {
            color:
                #07100b;

            background:
                #84cc16;

            border:
                0;
        }


        .hero {
            display:
                grid;

            grid-template-columns:
                1fr 320px;

            gap:
                14px;

            margin-bottom:
                14px;

            padding:
                22px;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .08);

            border-radius:
                20px;

            background:
                rgba(255,
                    255,
                    255,
                    .04);
        }


        .hero h1 {
            margin:
                4px 0 6px;

            font-size:
                clamp(32px,
                    6vw,
                    60px);

            letter-spacing:
                -.055em;

            line-height:
                .95;
        }


        .hero p {
            margin:
                0;

            max-width:
                620px;

            opacity:
                .6;
        }


        .kicker {
            font-size:
                9px;

            letter-spacing:
                .15em;

            color:
                #bef264;

            font-weight:
                900;
        }


        .profile {
            align-self:
                stretch;

            padding:
                14px;

            border-radius:
                14px;

            background:
                rgba(255,
                    255,
                    255,
                    .05);
        }


        .profile small {
            display:
                block;

            margin-bottom:
                7px;

            opacity:
                .5;

            font-weight:
                900;

            font-size:
                8px;

            letter-spacing:
                .1em;
        }


        .profile-row {
            display:
                grid;

            grid-template-columns:
                1fr auto;

            gap:
                6px;
        }


        .profile input,
        .search input {
            width:
                100%;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .1);

            outline:
                0;

            border-radius:
                10px;

            padding:
                10px;

            background:
                rgba(255,
                    255,
                    255,
                    .06);

            color:
                white;
        }


        .profile button {
            border:
                0;

            border-radius:
                10px;

            padding:
                0 12px;

            font-weight:
                900;
        }


        .msg {
            display:
                block;

            margin-top:
                7px;

            font-size:
                9px;

            opacity:
                .6;
        }


        .toolbar {
            display:
                flex;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                14px;
        }


        .filters {
            display:
                flex;

            gap:
                6px;

            flex-wrap:
                wrap;
        }


        .filter {
            border:
                1px solid rgba(255,
                    255,
                    255,
                    .1);

            border-radius:
                999px;

            padding:
                8px 11px;

            color:
                white;

            background:
                rgba(255,
                    255,
                    255,
                    .05);

            font-size:
                9px;

            font-weight:
                900;
        }


        .filter.active {
            background:
                #fff;

            color:
                #08111f;
        }


        .search {
            width:
                min(320px,
                    100%);
        }


        .notice {
            padding:
                12px;

            border-radius:
                12px;

            margin-bottom:
                12px;

            background:
                rgba(239,
                    68,
                    68,
                    .1);

            color:
                #fca5a5;
        }


        .grid {
            display:
                grid;

            grid-template-columns:
                repeat(3,
                    minmax(0,
                        1fr));

            gap:
                11px;
        }


        .card {
            padding:
                16px;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .08);

            border-radius:
                17px;

            background:
                linear-gradient(160deg,
                    rgba(255,
                        255,
                        255,
                        .065),
                    rgba(255,
                        255,
                        255,
                        .025));

            min-width:
                0;
        }


        .card.daily {
            border-color:
                rgba(132,
                    204,
                    22,
                    .45);

            box-shadow:
                inset 0 0 0 1px rgba(132,
                    204,
                    22,
                    .08);
        }


        .card-top {
            display:
                flex;

            justify-content:
                space-between;

            gap:
                8px;

            align-items:
                flex-start;
        }


        .card h2 {
            margin:
                0;

            font-size:
                20px;

            letter-spacing:
                -.035em;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .badge {
            flex-shrink:
                0;

            font-size:
                8px;

            padding:
                5px 7px;

            border-radius:
                999px;

            background:
                rgba(132,
                    204,
                    22,
                    .13);

            color:
                #d9f99d;

            font-weight:
                900;
        }


        .author {
            margin-top:
                3px;

            font-size:
                10px;

            opacity:
                .5;
        }


        .meta {
            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                6px;

            margin:
                14px 0;
        }


        .meta div {
            padding:
                9px;

            border-radius:
                10px;

            background:
                rgba(255,
                    255,
                    255,
                    .045);
        }


        .meta small {
            display:
                block;

            font-size:
                7px;

            letter-spacing:
                .08em;

            opacity:
                .4;

            font-weight:
                900;
        }


        .meta strong {
            display:
                block;

            margin-top:
                2px;

            font-size:
                11px;
        }


        .play {
            width:
                100%;

            border:
                0;

            border-radius:
                11px;

            padding:
                11px;

            background:
                #84cc16;

            color:
                #07100b;

            font-weight:
                900;
        }


        .empty {
            text-align:
                center;

            padding:
                40px;

            opacity:
                .45;
        }


        @media (max-width: 850px) {
            .hero {
                grid-template-columns:
                    1fr;
            }

            .grid {
                grid-template-columns:
                    repeat(2,
                        minmax(0,
                            1fr));
            }
        }


        @media (max-width: 580px) {
            .app {
                padding:
                    10px;
            }

            .top {
                align-items:
                    flex-start;
            }

            .actions {
                flex-wrap:
                    wrap;

                justify-content:
                    flex-end;
            }

            .toolbar {
                flex-direction:
                    column;
            }

            .search {
                width:
                    100%;
            }

            .grid {
                grid-template-columns:
                    1fr;
            }

            .hero {
                padding:
                    17px;
            }

            .hero h1 {
                font-size:
                    39px;
            }
        }
    </style>

</head>

<body>

    <main class="app">

        <header class="top">

            <a class="brand" href="index.html">
                <small>
                    DAILY CLIMB
                </small>

                <strong>
                    BANEOVERSIGT
                </strong>
            </a>


            <div class="actions">

                <a class="btn" href="index.html">
                    ← DAGENS
                </a>

                <a class="btn-primary" href="builder.html">
                    ＋ BYG BANE
                </a>

            </div>

        </header>


        <section class="hero">

            <div>

                <div class="kicker">
                    COMMUNITY BOULDERS
                </div>

                <h1>
                    Find din næste bane.
                </h1>

                <p>
                    Alle publicerede baner samlet ét sted.
                    Færrest moves vinder, derefter færrest
                    falls og til sidst tiden.
                </p>

            </div>


            <div class="profile">

                <small>
                    DIT KLATRERNAVN
                </small>

                <div class="profile-row">

                    <input id="username" maxlength="24" autocomplete="nickname" />

                    <button id="saveUsername" type="button">
                        GEM
                    </button>

                </div>

                <span class="msg" id="profileMessage"></span>

            </div>

        </section>


        <section class="toolbar">

            <div class="filters">

                <button class="filter active" data-filter="all">
                    ALLE
                </button>

                <button class="filter" data-filter="daily">
                    DAGENS
                </button>

                <button class="filter" data-filter="mine">
                    MINE
                </button>

                <button class="filter" data-filter="new">
                    NYESTE
                </button>

            </div>


            <label class="search">

                <input id="search" type="search" placeholder="Søg bane eller bygger…" />

            </label>

        </section>


        <div id="notice" class="notice hidden"></div>


        <div id="grid" class="grid"></div>


        <div id="empty" class="empty hidden">
            Ingen baner matcher.
        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="online.js"></script>


    <script>

        const online =
            window.DailyClimbOnline;


        const grid =
            document.getElementById(
                "grid"
            );


        const empty =
            document.getElementById(
                "empty"
            );


        const notice =
            document.getElementById(
                "notice"
            );


        const search =
            document.getElementById(
                "search"
            );


        const username =
            document.getElementById(
                "username"
            );


        const saveUsername =
            document.getElementById(
                "saveUsername"
            );


        const profileMessage =
            document.getElementById(
                "profileMessage"
            );


        let routes =
            [];

        let user =
            null;

        let dailyId =
            null;

        let filter =
            "all";


        function formatBest(
            best
        ) {
            if (
                !best
            ) {
                return "—";
            }


            const total =
                Math.max(
                    0,
                    best.timeMs /
                    1000
                );


            const min =
                Math.floor(
                    total /
                    60
                );


            const sec =
                Math.floor(
                    total %
                    60
                );


            const tenth =
                Math.floor(
                    (
                        total %
                        1
                    ) *
                    10
                );


            return (
                `${best.moves} · ${best.falls} · ${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}.${tenth}`
            );
        }


        function render() {
            const q =
                search.value
                    .trim()
                    .toLowerCase();


            let items =
                routes.filter(
                    route => {

                        if (
                            filter ===
                            "daily" &&
                            route.id !==
                            dailyId
                        ) {
                            return false;
                        }


                        if (
                            filter ===
                            "mine" &&
                            route.ownerId !==
                            user?.id
                        ) {
                            return false;
                        }


                        if (
                            q &&
                            !`${route.name} ${route.authorName}`
                                .toLowerCase()
                                .includes(
                                    q
                                )
                        ) {
                            return false;
                        }


                        return true;
                    }
                );


            if (
                filter ===
                "new"
            ) {
                items =
                    [
                        ...items
                    ].sort(
                        (
                            a,
                            b
                        ) =>
                            new Date(
                                b.createdAt
                            ) -
                            new Date(
                                a.createdAt
                            )
                    );
            }


            grid.innerHTML =
                "";


            empty
                .classList
                .toggle(
                    "hidden",
                    items.length >
                    0
                );


            for (
                const route of
                items
            ) {
                const card =
                    document.createElement(
                        "article"
                    );


                const isDaily =
                    route.id ===
                    dailyId;


                card.className =
                    `card${isDaily ? " daily" : ""}`;


                card.innerHTML = `
        <div class="card-top">

          <div style="min-width:0">

            <h2></h2>

            <div class="author"></div>

          </div>

          ${isDaily
                        ?
                        `<span class="badge">
                ⭐ DAGENS
              </span>`
                        :
                        ""
                    }

        </div>


        <div class="meta">

          <div>
            <small>
              GLOBAL BEST
            </small>

            <strong>
              ${formatBest(route.best)}
            </strong>
          </div>


          <div>
            <small>
              SPILLET
            </small>

            <strong>
              ${route.plays}
            </strong>
          </div>


          <div>
            <small>
              GREB
            </small>

            <strong>
              ${route.routeData?.holds?.length || 0}
            </strong>
          </div>


          <div>
            <small>
              OPDATERET
            </small>

            <strong>
              ${new Date(
                        route.updatedAt
                    )
                        .toLocaleDateString(
                            "da-DK"
                        )
                    }
            </strong>
          </div>

        </div>


        <button
          class="play"
          type="button"
        >
          ▶ SPIL BANE
        </button>
      `;


                card
                    .querySelector(
                        "h2"
                    )
                    .textContent =
                    route.name ||
                    "Uden navn";


                card
                    .querySelector(
                        ".author"
                    )
                    .textContent =
                    `af ${route.authorName}`;


                card
                    .querySelector(
                        ".play"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            location.href =
                                `index.html?route=${encodeURIComponent(route.id)}`;
                        }
                    );


                grid.appendChild(
                    card
                );
            }
        }


        async function init() {
            if (
                !online?.configured
            ) {
                notice
                    .classList
                    .remove(
                        "hidden"
                    );


                notice.textContent =
                    "Supabase er ikke sat op endnu. Udfyld supabase-config.js.";


                return;
            }


            try {
                await online.ensureSession();


                user =
                    await online.getUser();


                const profile =
                    await online.ensureProfile();


                username.value =
                    profile?.username ||
                    "";


                const [
                    allRoutes,
                    daily
                ] =
                    await Promise.all([
                        online.listRoutes(),

                        online.getDailySelection(),
                    ]);


                routes =
                    allRoutes;


                dailyId =
                    daily?.route_id ||
                    null;


                render();
            }

            catch (
            error
            ) {
                notice
                    .classList
                    .remove(
                        "hidden"
                    );


                notice.textContent =
                    error.message ||
                    "Kunne ikke hente banerne.";
            }
        }


        document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                button => {

                    button
                        .addEventListener(
                            "click",
                            () => {

                                document
                                    .querySelectorAll(
                                        ".filter"
                                    )
                                    .forEach(
                                        item =>
                                            item.classList.remove(
                                                "active"
                                            )
                                    );


                                button
                                    .classList
                                    .add(
                                        "active"
                                    );


                                filter =
                                    button.dataset.filter;


                                render();
                            }
                        );
                }
            );


        search
            .addEventListener(
                "input",
                render
            );


        saveUsername
            .addEventListener(
                "click",
                async () => {

                    try {
                        const profile =
                            await online.setUsername(
                                username.value
                            );


                        username.value =
                            profile.username;


                        profileMessage.textContent =
                            "Gemt ✓";


                        setTimeout(
                            () =>
                                profileMessage.textContent =
                                "",

                            1500
                        );
                    }

                    catch (
                    error
                    ) {
                        profileMessage.textContent =
                            error.message ||
                            "Kunne ikke gemme navnet.";
                    }
                }
            );


        username
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {
                        saveUsername.click();
                    }
                }
            );


        init();

    </script>

</body>

</html>
