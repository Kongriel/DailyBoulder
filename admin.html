<!doctype html>
<html lang="da">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
        Daily Climb — Admin
    </title>

    <style>
        :root {
            color-scheme:
                dark;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                #08111f;

            color:
                white;
        }


        * {
            box-sizing:
                border-box;
        }


        body {
            margin:
                0;

            min-height:
                100dvh;

            display:
                grid;

            place-items:
                center;

            padding:
                16px;
        }


        .card {
            width:
                min(420px,
                    100%);

            padding:
                24px;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .09);

            border-radius:
                20px;

            background:
                #0f1928;

            box-shadow:
                0 30px 90px rgba(0,
                    0,
                    0,
                    .35);
        }


        .eyebrow {
            font-size:
                9px;

            letter-spacing:
                .16em;

            color:
                #bef264;

            font-weight:
                900;
        }


        h1 {
            margin:
                5px 0 18px;

            font-size:
                34px;

            letter-spacing:
                -.05em;
        }


        label {
            display:
                block;

            margin:
                12px 0 6px;

            font-size:
                8px;

            letter-spacing:
                .1em;

            opacity:
                .55;

            font-weight:
                900;
        }


        input {
            width:
                100%;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .1);

            border-radius:
                10px;

            padding:
                11px;

            background:
                rgba(255,
                    255,
                    255,
                    .06);

            color:
                white;

            outline:
                0;
        }


        .actions {
            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                7px;

            margin-top:
                14px;
        }


        button,
        a {
            border-radius:
                10px;

            padding:
                11px;

            font-weight:
                900;

            text-decoration:
                none;

            text-align:
                center;

            font:
                inherit;
        }


        .primary {
            border:
                0;

            background:
                #84cc16;

            color:
                #07100b;
        }


        .ghost {
            border:
                1px solid rgba(255,
                    255,
                    255,
                    .1);

            background:
                rgba(255,
                    255,
                    255,
                    .05);

            color:
                white;
        }


        .msg {
            margin-top:
                12px;

            padding:
                10px;

            border-radius:
                10px;

            background:
                rgba(255,
                    255,
                    255,
                    .04);

            font-size:
                11px;

            line-height:
                1.45;

            opacity:
                .8;
        }


        .ok {
            color:
                #d9f99d;
        }


        .bad {
            color:
                #fca5a5;
        }


        .hidden {
            display:
                none !important;
        }
    </style>

</head>

<body>


    <div class="card">

        <div class="eyebrow">
            DAILY CLIMB
        </div>

        <h1>
            ADMIN
        </h1>


        <div id="loginBox">

            <label for="email">
                EMAIL
            </label>

            <input id="email" type="email" autocomplete="username" />


            <label for="password">
                PASSWORD
            </label>

            <input id="password" type="password" autocomplete="current-password" />


            <div class="actions">

                <button id="login" class="primary" type="button">
                    LOG IND
                </button>

                <a class="ghost" href="builder.html">
                    ← BUILDER
                </a>

            </div>

        </div>


        <div id="loggedBox" class="hidden">

            <div class="msg ok">
                👑 Du er logget ind som admin.
                Gå tilbage til builderen —
                dine online-baner får nu
                knappen ⭐ DAGENS.
            </div>


            <div class="actions">

                <a class="primary" href="builder.html">
                    ÅBN BUILDER
                </a>

                <button id="logout" class="ghost" type="button">
                    LOG UD
                </button>

            </div>

        </div>


        <div id="message" class="msg">
            Admin-kontoen oprettes én gang
            i Supabase Dashboard.
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="online.js"></script>


    <script>

        const online =
            window.DailyClimbOnline;


        const loginBox =
            document.getElementById(
                "loginBox"
            );


        const loggedBox =
            document.getElementById(
                "loggedBox"
            );


        const message =
            document.getElementById(
                "message"
            );


        const email =
            document.getElementById(
                "email"
            );


        const password =
            document.getElementById(
                "password"
            );


        async function refresh() {

            if (
                !online?.configured
            ) {
                message.className =
                    "msg bad";

                message.textContent =
                    "Udfyld supabase-config.js først.";

                return;
            }


            try {
                await online.ensureSession();


                const admin =
                    await online.isAdmin();


                loginBox
                    .classList
                    .toggle(
                        "hidden",
                        admin
                    );


                loggedBox
                    .classList
                    .toggle(
                        "hidden",
                        !admin
                    );


                if (
                    admin
                ) {
                    message.className =
                        "msg ok";

                    message.textContent =
                        "Admin-session aktiv ✓";
                }
            }

            catch (
            error
            ) {
                message.className =
                    "msg bad";

                message.textContent =
                    error.message ||
                    "Kunne ikke starte admin.";
            }
        }


        document
            .getElementById(
                "login"
            )
            .addEventListener(
                "click",
                async () => {

                    try {
                        message.className =
                            "msg";

                        message.textContent =
                            "Logger ind…";


                        const admin =
                            await online.signInAdmin(
                                email.value.trim(),
                                password.value
                            );


                        if (
                            !admin
                        ) {
                            message.className =
                                "msg bad";

                            message.textContent =
                                "Login virker, men denne bruger er ikke i admins-tabellen.";

                            return;
                        }


                        await refresh();
                    }

                    catch (
                    error
                    ) {
                        message.className =
                            "msg bad";

                        message.textContent =
                            error.message ||
                            "Forkert login.";
                    }
                }
            );


        document
            .getElementById(
                "logout"
            )
            .addEventListener(
                "click",
                async () => {

                    await online.signOut();

                    location.reload();
                }
            );


        password
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {
                        document
                            .getElementById(
                                "login"
                            )
                            .click();
                    }
                }
            );


        refresh();

    </script>

</body>

</html>
